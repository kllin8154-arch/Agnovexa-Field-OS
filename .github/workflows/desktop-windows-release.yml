name: Desktop Windows Release (Manual)

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: opsdesk-windows-release-manual
  cancel-in-progress: true

jobs:
  windows-release:
    runs-on: windows-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install locked dependencies
        working-directory: desktop
        run: npm ci

      - name: Audit production dependencies
        working-directory: desktop
        run: npm audit --omit=dev --audit-level=high

      - name: Verify locked Rust dependency graph
        working-directory: desktop
        run: cargo metadata --locked --format-version 1 --manifest-path src-tauri/Cargo.toml > $null

      - name: Generate desktop icons
        working-directory: desktop
        run: npm run prepare:icons

      - name: Unit tests
        working-directory: desktop
        run: npm run test

      - name: Type-check and web build
        working-directory: desktop
        run: npm run build

      - name: Test local MCP protocol integration
        working-directory: desktop
        run: npm run mcp:test

      - name: Test Tauri backend with lockfile
        working-directory: desktop
        run: cargo test --locked --quiet --manifest-path src-tauri/Cargo.toml --lib

      - name: Check Tauri backend with lockfile
        working-directory: desktop
        run: cargo check --locked --quiet --manifest-path src-tauri/Cargo.toml

      - name: Build NSIS EXE and publish GitHub Release
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: desktop
          tagName: opsdesk-v__VERSION__-manual.${{ github.run_number }}
          releaseName: Agnovexa OpsDesk v__VERSION__ · Manual Build ${{ github.run_number }}
          releaseBody: |
            Windows x64 NSIS 安装程序。

            - 所有命令与 SQL 仅供人工审核和人工执行。
            - 包含可校验备份恢复、部署报告、Skill 专库和双知识库可信发布。
            - API Key 不进入 SQLite、备份、报告、知识库或 Git。
            - 内置只读 stdio MCP Server，可查询项目上下文并诊断工作流断点；不提供远程执行或写入工具。
            - 使用已提交的 npm 与 Cargo 锁文件完成可重复构建。
          releaseCommitish: main
          releaseDraft: false
          prerelease: false
          args: --bundles nsis
          releaseAssetNamePattern: Agnovexa-OpsDesk-Windows-x64-Setup[ext]
          uploadWorkflowArtifacts: true
          workflowArtifactNamePattern: Agnovexa-OpsDesk-Windows-x64
          retryAttempts: 1
