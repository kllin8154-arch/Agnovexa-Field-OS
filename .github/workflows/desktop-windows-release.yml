name: Desktop Windows Release (Manual Fallback)

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: opsdesk-windows-release-manual
  cancel-in-progress: true

jobs:
  windows-release:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        working-directory: desktop
        run: npm install

      - name: Generate desktop icons
        working-directory: desktop
        run: npm run prepare:icons

      - name: Unit tests
        working-directory: desktop
        run: npm run test

      - name: Type-check and web build
        working-directory: desktop
        run: npm run build

      - name: Build NSIS EXE and publish GitHub Release
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: desktop
          tagName: opsdesk-v__VERSION__-manual.${{ github.run_number }}
          releaseName: Agnovexa OpsDesk v__VERSION__ · Manual Build ${{ github.run_number }}
          releaseBody: |
            Windows x64 NSIS 离线安装包。所有命令与 SQL 仅供人工审核和人工执行。
          releaseDraft: false
          prerelease: false
          args: --bundles nsis
          releaseAssetNamePattern: Agnovexa-OpsDesk-Setup[ext]
          uploadWorkflowArtifacts: true
          workflowArtifactNamePattern: Agnovexa-OpsDesk-Windows-[arch]
          retryAttempts: 1
