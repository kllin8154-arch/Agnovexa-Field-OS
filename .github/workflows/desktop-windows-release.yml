name: Desktop Windows Release

on:
  push:
    branches:
      - "agent/desktop-mvp-foundation"
      - "main"
    paths:
      - "desktop/**"
      - ".github/workflows/desktop-windows-release.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: opsdesk-windows-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows-release:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        working-directory: desktop
        run: npm install

      - name: Generate desktop icons
        working-directory: desktop
        run: npm run prepare:icons

      - name: Unit tests
        working-directory: desktop
        run: npm run test

      - name: Type-check and web build
        working-directory: desktop
        run: npm run build

      - name: Build NSIS EXE and publish GitHub Release
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: desktop
          tagName: opsdesk-v__VERSION__-build.${{ github.run_number }}
          releaseName: Agnovexa OpsDesk v__VERSION__ · Build ${{ github.run_number }}
          releaseBody: |
            Windows x64 离线安装包。

            - 不包含 SSH、Shell、数据库自动执行或远程写入能力。
            - 命令和 SQL 只能复制后由现场工程师人工执行。
            - 支持多种 OpenAI Chat Completions 兼容 AI Provider。
            - API Key 仅保留在当前应用运行内存中。
            - 安装包内置 WebView2 离线安装器，适合无外网现场。
          releaseDraft: false
          prerelease: false
          args: --bundles nsis
          releaseAssetNamePattern: Agnovexa-OpsDesk-Setup[ext]
          uploadWorkflowArtifacts: true
          workflowArtifactNamePattern: Agnovexa-OpsDesk-Windows-[arch]
          retryAttempts: 1
