name: Desktop CI and Windows Release

on:
  pull_request:
    paths:
      - "desktop/**"
      - "README.md"
      - "OPS_DESK_DOWNLOAD.md"
      - ".github/workflows/desktop-web-check.yml"
  push:
    branches:
      - "main"
    paths:
      - "desktop/**"
      - "README.md"
      - "OPS_DESK_DOWNLOAD.md"
      - ".github/workflows/desktop-web-check.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: opsdesk-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: desktop
    steps:
      - name: Checkout verified source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Production dependency audit
        run: npm audit --omit=dev --audit-level=high

      - name: Unit tests
        run: npm run test

      - name: Type-check and web build
        run: npm run build

  tauri-check:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: desktop
    steps:
      - name: Checkout verified source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Generate desktop icons from SVG
        run: npm run prepare:icons

      - name: Test Tauri backend
        run: cargo test --quiet --manifest-path src-tauri/Cargo.toml --lib

      - name: Check Tauri backend
        run: cargo check --quiet --manifest-path src-tauri/Cargo.toml

  windows-release:
    if: >-
      (github.event_name == 'pull_request' &&
       github.event.pull_request.head.repo.full_name == github.repository &&
       startsWith(github.event.pull_request.head.ref, 'agent/opsdesk-windows-release')) ||
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      github.event_name == 'workflow_dispatch'
    needs:
      - web-build
      - tauri-check
    permissions:
      contents: write
    runs-on: windows-latest
    steps:
      - name: Checkout verified source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        working-directory: desktop
        run: npm install --no-audit --no-fund

      - name: Generate desktop icons from SVG
        working-directory: desktop
        run: npm run prepare:icons

      - name: Unit tests
        working-directory: desktop
        run: npm run test

      - name: Type-check and web build
        working-directory: desktop
        run: npm run build

      - name: Build NSIS EXE and publish GitHub Release
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: desktop
          tagName: opsdesk-v__VERSION__-build.${{ github.run_number }}
          releaseName: Agnovexa OpsDesk v__VERSION__ · Build ${{ github.run_number }}
          releaseBody: |
            Windows x64 NSIS 安装程序。

            - 不包含 SSH、SFTP、Shell、生产数据库执行或远程写入能力。
            - 命令和 SQL 只能由现场工程师复制后人工执行。
            - AI 服务配置与 AI 工作台完全分离，支持多 Provider。
            - 新增 SQLite 完整性检查、SHA-256 工作区备份恢复与部署报告归档。
            - API Key 不进入 SQLite、工作区备份、报告或 Git。
            - 安装包内置 WebView2 离线安装器。
          releaseCommitish: ${{ github.event.pull_request.head.sha || github.sha }}
          releaseDraft: false
          prerelease: false
          args: --bundles nsis
          releaseAssetNamePattern: Agnovexa-OpsDesk-Windows-x64-Setup[ext]
          uploadWorkflowArtifacts: true
          workflowArtifactNamePattern: Agnovexa-OpsDesk-Windows-x64
          retryAttempts: 1
