name: Desktop CI and Windows Release

on:
  pull_request:
    paths:
      - "desktop/**"
      - "README.md"
      - "OPS_DESK_DOWNLOAD.md"
      - ".github/workflows/desktop-web-check.yml"
      - ".github/workflows/desktop-windows-release.yml"
  push:
    branches:
      - "main"
    paths:
      - "desktop/**"
      - "README.md"
      - "OPS_DESK_DOWNLOAD.md"
      - ".github/workflows/desktop-web-check.yml"
      - ".github/workflows/desktop-windows-release.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: opsdesk-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: desktop
    steps:
      - name: Checkout verified source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - name: Install locked dependencies
        run: npm ci

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Unit tests
        run: npm run test

      - name: Type-check and web build
        run: npm run build

      - name: Install CJK font for readable visual QA
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends fonts-noto-cjk
          fc-cache -f

      - name: Render light and dark UI smoke screenshots
        shell: bash
        run: |
          set -euo pipefail
          BROWSER="$(command -v google-chrome-stable || command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          test -n "$BROWSER"
          rm -rf visual-qa /tmp/opsdesk-chrome-light /tmp/opsdesk-chrome-dark
          mkdir -p visual-qa
          python3 -m http.server 4173 --directory dist >visual-qa/static-server.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
          for _ in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:4173/ >/dev/null; then break; fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:4173/ >/dev/null

          COMMON=(--headless --no-sandbox --disable-gpu --hide-scrollbars --run-all-compositor-stages-before-draw --virtual-time-budget=2500 --window-size=1440,900)
          "$BROWSER" "${COMMON[@]}" --user-data-dir=/tmp/opsdesk-chrome-light --screenshot=visual-qa/dashboard-light.png http://127.0.0.1:4173/#/
          "$BROWSER" "${COMMON[@]}" --user-data-dir=/tmp/opsdesk-chrome-light --screenshot=visual-qa/ai-settings-light.png http://127.0.0.1:4173/#/ai-settings
          "$BROWSER" "${COMMON[@]}" --user-data-dir=/tmp/opsdesk-chrome-dark --force-dark-mode --screenshot=visual-qa/dashboard-dark.png http://127.0.0.1:4173/#/
          "$BROWSER" "${COMMON[@]}" --user-data-dir=/tmp/opsdesk-chrome-dark --force-dark-mode --screenshot=visual-qa/skills-dark.png http://127.0.0.1:4173/#/skills
          "$BROWSER" "${COMMON[@]}" --user-data-dir=/tmp/opsdesk-chrome-dark --force-dark-mode --screenshot=visual-qa/workspace-dark.png http://127.0.0.1:4173/#/workspace

          test -s visual-qa/dashboard-light.png
          test -s visual-qa/ai-settings-light.png
          test -s visual-qa/dashboard-dark.png
          test -s visual-qa/skills-dark.png
          test -s visual-qa/workspace-dark.png
          file visual-qa/*.png

      - name: Upload built web UI for visual QA
        uses: actions/upload-artifact@v4
        with:
          name: opsdesk-web-preview
          path: desktop/dist
          if-no-files-found: error
          retention-days: 7

      - name: Upload visual smoke screenshots
        uses: actions/upload-artifact@v4
        with:
          name: opsdesk-visual-qa
          path: desktop/visual-qa
          if-no-files-found: error
          retention-days: 14

  tauri-check:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: desktop
    steps:
      - name: Checkout verified source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install locked dependencies
        run: npm ci

      - name: Generate desktop icons from SVG
        run: npm run prepare:icons

      - name: Test Tauri backend with lockfile
        run: cargo test --locked --quiet --manifest-path src-tauri/Cargo.toml --lib

      - name: Check Tauri backend with lockfile
        run: cargo check --locked --quiet --manifest-path src-tauri/Cargo.toml

  windows-release:
    if: >-
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      github.event_name == 'workflow_dispatch'
    needs:
      - web-build
      - tauri-check
    permissions:
      contents: write
    runs-on: windows-latest
    steps:
      - name: Checkout verified source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install locked dependencies
        working-directory: desktop
        run: npm ci

      - name: Verify locked Rust dependency graph
        working-directory: desktop
        run: cargo metadata --locked --format-version 1 --manifest-path src-tauri/Cargo.toml > $null

      - name: Generate desktop icons from SVG
        working-directory: desktop
        run: npm run prepare:icons

      - name: Unit tests
        working-directory: desktop
        run: npm run test

      - name: Type-check and web build
        working-directory: desktop
        run: npm run build

      - name: Build NSIS EXE and publish GitHub Release
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: desktop
          tagName: opsdesk-v__VERSION__-build.${{ github.run_number }}
          releaseName: Agnovexa OpsDesk v__VERSION__ · Build ${{ github.run_number }}
          releaseBody: |
            Windows x64 NSIS 安装程序。

            - 不包含 SSH、SFTP、Shell、数据库自动执行或远程写入能力。
            - 命令和 SQL 只能由现场工程师复制后人工执行。
            - 支持 DeepSeek、OpenAI、通义千问、Kimi、智谱 GLM、硅基流动及自定义兼容接口。
            - API Key 不进入 Git、报告、知识库或工作区备份。
            - 使用已提交的 npm 与 Cargo 锁文件完成可重复构建。
            - 安装包内置 WebView2 离线安装器。
          releaseCommitish: ${{ github.sha }}
          releaseDraft: false
          prerelease: false
          args: --bundles nsis
          releaseAssetNamePattern: Agnovexa-OpsDesk-Windows-x64-Setup[ext]
          uploadWorkflowArtifacts: true
          workflowArtifactNamePattern: Agnovexa-OpsDesk-Windows-x64
          retryAttempts: 1
