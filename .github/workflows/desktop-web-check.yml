name: Desktop Web Check

on:
  pull_request:
    paths:
      - "desktop/**"
      - ".github/workflows/desktop-web-check.yml"
      - ".github/workflows/desktop-windows-release.yml"
  push:
    branches:
      - "agent/desktop-mvp-foundation"
    paths:
      - "desktop/**"
      - ".github/workflows/desktop-web-check.yml"
      - ".github/workflows/desktop-windows-release.yml"

permissions:
  contents: read

jobs:
  web-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: desktop
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Unit tests
        run: npm run test

      - name: Type-check and build
        run: npm run build

  tauri-check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: desktop
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install frontend dependencies
        run: npm install

      - name: Generate desktop icons
        run: npm run prepare:icons

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Test and check Tauri backend
        shell: bash
        run: |
          set +e
          cargo test --quiet --manifest-path src-tauri/Cargo.toml --lib > /tmp/opsdesk-cargo-test.log 2>&1
          test_status=$?
          tail -n 160 /tmp/opsdesk-cargo-test.log
          if [ "$test_status" -ne 0 ]; then
            exit "$test_status"
          fi

          cargo check --quiet --manifest-path src-tauri/Cargo.toml > /tmp/opsdesk-cargo-check.log 2>&1
          check_status=$?
          tail -n 160 /tmp/opsdesk-cargo-check.log
          exit "$check_status"
