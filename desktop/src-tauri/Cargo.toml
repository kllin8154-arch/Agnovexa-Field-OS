[package]
name = "agnovexa-opsdesk"
version = "0.1.0"
description = "Offline-first, human-controlled field deployment workbench"
authors = ["Agnovexa"]
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "agnovexa_opsdesk_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
tauri = { version = "2", features = [] }
tauri-plugin-sql = { version = "2", features = ["sqlite"] }
